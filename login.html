<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/src/css/login.css">
  <title>Enter Key</title>
</head>

<body>

  <section class="login-section">
    <h2 class="login-header">Enter Access Key</h2>
    <form id="keyForm" class="login-form">
      <input type="password" id="keyInput" placeholder="Enter Key" class="input-password" required />
      <button type="submit" class="login-submit">Submit</button>
    </form>

  </section>

  <script type="module" src="/src/js/login.js"></script>
</body>

</html>
